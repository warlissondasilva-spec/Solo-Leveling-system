<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Solo Leveling System</title>

  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a10">

  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: #151828;
      --accent-blue: #00d2ff;
      --accent-purple: #9d4edd;
      --text-main: #e0e6ed;
      --text-dim: #7a889b;
      --danger: #ff0055;
      --success: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Indispensable sur iOS : sinon impossible de taper dans les champs */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 15px;
      padding-top: calc(15px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      margin-bottom: 20px;
      gap: 10px;
    }

    h1 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .btn-icon:hover {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 10px var(--accent-blue);
    }

    /* Player Status Card */
    .status-card {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .title-tag {
      color: var(--accent-purple);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .stat-bar-container { margin-top: 10px; }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .bar {
      height: 8px;
      background: #0a0b10;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      width: 45%;
      transition: width 0.5s ease;
    }

    /* Console Container */
    .console-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-dim);
    }

    .tab.active {
      border-color: var(--accent-purple);
      color: var(--text-main);
      background: rgba(157, 78, 221, 0.15);
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
    }

    .chat-box {
      flex: 1;
      min-height: 200px;
      max-height: 350px;
      overflow-y: auto;
      background: #0a0b10;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 85%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg-system {
      background: rgba(0, 210, 255, 0.1);
      border-left: 3px solid var(--accent-blue);
      align-self: flex-start;
      color: var(--text-main);
    }

    .msg-user {
      background: rgba(157, 78, 221, 0.2);
      border-right: 3px solid var(--accent-purple);
      align-self: flex-end;
      color: #fff;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input[type="text"],
    input[type="password"] {
      flex: 1;
      background: #0a0b10;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 16px; /* évite le zoom automatique sur iOS */
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent-purple);
    }

    .btn-send {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-send:hover:not(:disabled) {
      box-shadow: 0 0 12px var(--accent-purple);
    }

    /* Modal Settings */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
    }

    .modal h2 {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 15px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .field input { width: 100%; }

    /* Avatar & Galerie */
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      border: 1px solid var(--accent-purple);
      box-shadow: 0 0 12px rgba(157, 78, 221, 0.5);
      margin-right: 12px;
      object-fit: cover;
      background: #0a0b10;
    }

    .gallery {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
    }

    .gallery figure {
      flex: 0 0 75%;
      max-width: 320px;
      scroll-snap-align: start;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      background: #0a0b10;
    }

    .gallery figcaption {
      padding: 8px 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>SYSTEM // SOLO LEVELING</h1>
    <button class="btn-icon" onclick="openSettings()">⚙️ RÉGLAGES</button>
  </header>

  <!-- Player Status Card -->
  <div class="status-card">
    <div class="status-header">
      <div style="display: flex; align-items: center;">
        <img class="avatar" src="images/monarque.svg" alt="Silhouette du Monarque des Ombres">
        <div>
          <div class="title-tag">MONARQUE DES OMBRES</div>
          <h2>SUNG JIN-WOO</h2>
        </div>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 0.8rem; color: var(--text-dim);">NIVEAU</span>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent-blue);">18</div>
      </div>
    </div>

    <!-- XP Bar -->
    <div class="stat-bar-container">
      <div class="stat-label">
        <span>EXPÉRIENCE</span>
        <span>450 / 1000</span>
      </div>
      <div class="bar">
        <div class="bar-fill" style="width: 45%;"></div>
      </div>
    </div>
  </div>

  <!-- Galerie -->
  <div class="gallery">
    <figure>
      <img src="images/portail.svg" alt="Un portail de rang S qui s'ouvre au-dessus de la ville">
      <figcaption>Portail de rang S</figcaption>
    </figure>
    <figure>
      <img src="images/armee.svg" alt="Le Monarque des Ombres devant son armée d'ombres">
      <figcaption>L'armée des ombres</figcaption>
    </figure>
    <figure>
      <img src="images/dague.svg" alt="Une dague lumineuse">
      <figcaption>Croc du Roi Kasaka</figcaption>
    </figure>
  </div>

  <!-- Console Agents -->
  <div class="console-section">
    <div class="tabs">
      <div class="tab active" data-agent="architecte">🛠️ ARCHITECTE (AUTO-CODE)</div>
      <div class="tab" data-agent="regulateur">📊 RÉGULATEUR</div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message msg-system">
        [SYSTÈME]: Agent Architecte connecté avec accès GitHub &amp; CI/CD. Prêt pour l'auto-codage.
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Donnez un ordre de modification au Système..." autocomplete="off">
      <button class="btn-send" id="sendBtn">ENVOYER</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>⚙️ CONFIGURATION GITHUB</h2>
      <div class="field">
        <label for="ghUser">Nom d'utilisateur GitHub</label>
        <input type="text" id="ghUser" placeholder="ex: mon-pseudo" autocomplete="off" autocapitalize="off">
      </div>
      <div class="field">
        <label for="ghRepo">Nom du Dépôt</label>
        <input type="text" id="ghRepo" placeholder="solo-leveling-system" autocomplete="off" autocapitalize="off">
      </div>
      <div class="field">
        <label for="ghToken">Token GitHub (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" autocapitalize="off">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-send" style="flex: 1; padding: 12px;" onclick="saveSettings()">SAUVEGARDER</button>
        <button class="btn-icon" onclick="closeSettings()">FERMER</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration par défaut (AUCUN secret dans le code : le token se saisit dans les Réglages
    // et reste uniquement dans le localStorage de cet appareil)
    const DEFAULT_USER = "warlissondasilva-spec";
    const DEFAULT_REPO = "solo-leveling-system";

    let activeAgent = 'architecte';
    let busy = false;

    // ---------- Stockage sûr (le localStorage peut être indisponible) ----------
    function lsGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function lsSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* ignoré */ }
    }

    // ---------- Onglets ----------
    function switchTab(agent, el) {
      activeAgent = agent;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      appendMessage('system', `[CONVERSATION]: Basculé sur l'agent ${agent.toUpperCase()}.`);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.agent, tab));
    });

    // ---------- Modal ----------
    function openSettings() {
      document.getElementById('ghUser').value = lsGet('gh_user') || DEFAULT_USER;
      document.getElementById('ghRepo').value = lsGet('gh_repo') || DEFAULT_REPO;
      document.getElementById('ghToken').value = lsGet('gh_token') || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      lsSet('gh_user', document.getElementById('ghUser').value.trim());
      lsSet('gh_repo', document.getElementById('ghRepo').value.trim());
      lsSet('gh_token', document.getElementById('ghToken').value.trim());
      closeSettings();
      appendMessage('system', '[SYSTÈME]: Paramètres GitHub sauvegardés avec succès !');
    }

    // ---------- Chat ----------
    function appendMessage(type, text) {
      const chatBox = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `message msg-${type}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setBusy(state) {
      busy = state;
      document.getElementById('sendBtn').disabled = state;
    }

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    async function sendMessage() {
      if (busy) return;

      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      if (activeAgent === 'architecte') {
        setBusy(true);
        appendMessage('system', "⚡ [ARCHITECTE]: Connexion à l'API GitHub en cours...");

        const result = await commitCodeToGitHub(text);
        if (result.ok) {
          appendMessage('system', '✅ [ARCHITECTE]: Commit réussi ! Netlify déploie la mise à jour...');
        } else {
          appendMessage('system', `❌ [ARCHITECTE]: Échec du commit — ${result.error}`);
        }
        setBusy(false);
      } else {
        appendMessage('system', `[RÉGULATEUR]: Analyse de votre message : "${text}". Niveau de fatigue calculé. Quête mise à jour.`);
      }
    }

    // ---------- Helpers Base64 UTF-8 (remplacent escape/unescape, obsolètes) ----------
    function base64ToUtf8(b64) {
      const binary = atob(b64.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    // ---------- Commit GitHub ----------
    async function commitCodeToGitHub(userInstruction) {
      const ghUser = lsGet('gh_user') || DEFAULT_USER;
      const ghRepo = lsGet('gh_repo') || DEFAULT_REPO;
      const ghToken = lsGet('gh_token');

      if (!ghUser || !ghRepo || !ghToken) {
        openSettings();
        return { ok: false, error: 'identifiants manquants, renseignez-les dans les Réglages.' };
      }

      const url = `https://api.github.com/repos/${encodeURIComponent(ghUser)}/${encodeURIComponent(ghRepo)}/contents/index.html`;
      const headers = {
        'Authorization': `Bearer ${ghToken}`,
        'Accept': 'application/vnd.github+json'
      };

      try {
        // 1. Récupérer le fichier et son SHA
        const getRes = await fetch(url, { headers, cache: 'no-store' });
        if (!getRes.ok) {
          const err = await getRes.json().catch(() => ({}));
          console.error('Erreur Fetch GitHub:', getRes.status, err);
          return { ok: false, error: `lecture impossible (${getRes.status}) ${err.message || ''}`.trim() };
        }

        const fileData = await getRes.json();
        const currentContent = base64ToUtf8(fileData.content);

        // 2. Modification : note de mise à jour insérée avant </body> (et non après </html>)
        const safeInstruction = userInstruction.replace(/--/g, '- -');
        const note = `  <!-- Architect Auto-Update: ${safeInstruction} -->\n`;
        const updatedContent = currentContent.includes('</body>')
          ? currentContent.replace('</body>', note + '</body>')
          : currentContent + '\n' + note;

        // 3. Envoyer la mise à jour
        const putRes = await fetch(url, {
          method: 'PUT',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Architect: ${userInstruction}`,
            content: utf8ToBase64(updatedContent),
            sha: fileData.sha
          })
        });

        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          console.error('Erreur Commit API:', putRes.status, errData);
          return { ok: false, error: `écriture refusée (${putRes.status}) ${errData.message || ''}`.trim() };
        }

        return { ok: true };
      } catch (err) {
        console.error('Erreur réseau:', err);
        return { ok: false, error: 'erreur réseau ou CORS, voir la console.' };
      }
    }
  </script>
</body>
</html>
