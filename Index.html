<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solo Leveling System</title>
  
  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a10">

  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: #151828;
      --accent-blue: #00d2ff;
      --accent-purple: #9d4edd;
      --text-main: #e0e6ed;
      --text-dim: #7a889b;
      --danger: #ff0055;
      --success: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-icon:hover {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 10px var(--accent-blue);
    }

    /* Player Status Card */
    .status-card {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .title-tag {
      color: var(--accent-purple);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .stat-bar-container {
      margin-top: 10px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .bar {
      height: 8px;
      background: #0a0b10;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      width: 45%;
      transition: width 0.5s ease;
    }

    /* Console Container */
    .console-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-dim);
    }

    .tab.active {
      border-color: var(--accent-purple);
      color: var(--text-main);
      background: rgba(157, 78, 221, 0.15);
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
    }

    .chat-box {
      flex: 1;
      min-height: 200px;
      max-height: 350px;
      overflow-y: auto;
      background: #0a0b10;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 85%;
      line-height: 1.4;
    }

    .msg-system {
      background: rgba(0, 210, 255, 0.1);
      border-left: 3px solid var(--accent-blue);
      align-self: flex-start;
      color: var(--text-main);
    }

    .msg-user {
      background: rgba(157, 78, 221, 0.2);
      border-right: 3px solid var(--accent-purple);
      align-self: flex-end;
      color: #fff;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: #0a0b10;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
    }

    .btn-send {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-send:hover {
      box-shadow: 0 0 12px var(--accent-purple);
    }

    /* Modal Settings */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
    }

    .modal h2 {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>SYSTEM // SOLO LEVELING</h1>
    <button class="btn-icon" onclick="openSettings()">⚙️ RÉGLAGES</button>
  </header>

  <!-- Player Status Card -->
  <div class="status-card">
    <div class="status-header">
      <div>
        <div class="title-tag">MONARQUE DES OMBRES</div>
        <h2>SUNG JIN-WOO</h2>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 0.8rem; color: var(--text-dim);">NIVEAU</span>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent-blue);">18</div>
      </div>
    </div>

    <!-- XP Bar -->
    <div class="stat-bar-container">
      <div class="stat-label">
        <span>EXPÉRIENCE</span>
        <span>450 / 1000</span>
      </div>
      <div class="bar">
        <div class="bar-fill" style="width: 45%;"></div>
      </div>
    </div>
  </div>

  <!-- Console Agents -->
  <div class="console-section">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('architecte')">🛠️ ARCHITECTE (AUTO-CODE)</div>
      <div class="tab" onclick="switchTab('regulateur')">📊 RÉGULATEUR</div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message msg-system">
        [SYSTÈME]: Agent Architecte connecté avec accès GitHub & CI/CD. Prêt pour l'auto-codage.
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Donnez un ordre de modification au Système..." onkeypress="handleKeyPress(event)">
      <button class="btn-send" onclick="sendMessage()">ENVOYER</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>⚙️ CONFIGURATION GITHUB</h2>
      <div class="field">
        <label>Nom d'utilisateur GitHub</label>
        <input type="text" id="ghUser" placeholder="ex: mon-pseudo">
      </div>
      <div class="field">
        <label>Nom du Dépôt</label>
        <input type="text" id="ghRepo" value="solo-leveling-system">
      </div>
      <div class="field">
        <label>Token GitHub (PAT / Classic)</label>
        <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-send" style="flex: 1;" onclick="saveSettings()">SAUVEGARDER</button>
        <button class="btn-icon" onclick="closeSettings()">FERMER</button>
      </div>
    </div>
  </div>

  <script>
    // LocalStorage Configuration Auto-load
    // REMPLACE CES VALEURS PAR TES VRAIS IDENTIFIANTS SI TU VEUX TOUT PRÉ-REMPLIR
    const DEFAULT_USER = "warlissondasilva-spec";
    const DEFAULT_REPO = "solo-leveling-system";
    const DEFAULT_TOKEN = "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";

    if (!localStorage.getItem('gh_user')) localStorage.setItem('gh_user', DEFAULT_USER);
    if (!localStorage.getItem('gh_repo')) localStorage.setItem('gh_repo', DEFAULT_REPO);
    if (!localStorage.getItem('gh_token')) localStorage.setItem('gh_token', DEFAULT_TOKEN);

    // Dynamic Variables
    let activeAgent = 'architecte';

    // Tabs Switcher
    function switchTab(agent) {
      activeAgent = agent;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      appendMessage('system', `[CONVERSATION]: Basculé sur l'agent ${agent.toUpperCase()}.`);
    }

    // Modal Control
    function openSettings() {
      document.getElementById('ghUser').value = localStorage.getItem('gh_user') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      closeSettings();
      appendMessage('system', '[SYSTÈME]: Paramètres GitHub sauvegardés avec succès !');
    }

    // Chat Functions
    function appendMessage(type, text) {
      const chatBox = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `message msg-${type}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      if (activeAgent === 'architecte') {
        appendMessage('system', '⚡ [ARCHITECTE]: Traitement de la demande et préparation du commit GitHub...');
        
        // Simuler ou appeler la mise à jour GitHub réelle
        const success = await commitCodeToGitHub(`<!-- Updated Request: ${text} -->\n` + document.documentElement.outerHTML, `Architect Update: ${text}`);
        if (success) {
          appendMessage('system', '✅ [ARCHITECTE]: Code mis à jour avec succès sur GitHub ! Déploiement Netlify initié.');
        } else {
          appendMessage('system', '❌ [ARCHITECTE]: Échec lors de la transmission du code. Vérifiez votre Token/Permissions.');
        }
      } else {
        appendMessage('system', `[RÉGULATEUR]: Demande analysée : "${text}". Constantes vitales optimales.`);
      }
    }

    // GitHub API Commit Handler
    async function commitCodeToGitHub(newContent, commitMessage = "Auto-update by Architect Agent") {
      const ghUser = localStorage.getItem('gh_user');
      const ghRepo = localStorage.getItem('gh_repo');
      const ghToken = localStorage.getItem('gh_token');

      if (!ghUser || !ghRepo || !ghToken || ghToken.includes('TON_TOKEN')) {
        alert("⚠️ Erreur : Veuillez renseigner votre Pseudo et Token GitHub dans les Réglages ⚙️ !");
        return false;
      }

      try {
        const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/index.html`;
        
        // 1. Récupérer le SHA du fichier existant
        const getRes = await fetch(url, {
          headers: { 'Authorization': `token ${ghToken}` }
        });

        if (!getRes.ok) throw new Error("Fichier introuvable sur le dépôt GitHub.");
        const fileData = await getRes.json();
        const currentSha = fileData.sha;

        // 2. Encoder le nouveau contenu en Base64 UTF-8
        const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

        // 3. Envoyer la mise à jour PUT
        const putRes = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${ghToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: commitMessage,
            content: encodedContent,
            sha: currentSha
          })
        });

        return putRes.ok;
      } catch (err) {
        console.error("GitHub API Error:", err);
        return false;
      }
    }
  </script>
</body>
</html>
